services:
  db:
    image: mysql:8.0
    container_name: sms_mysql_${COMPOSE_PROJECT_NAME:-local}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management_db}
      MYSQL_USER: ${MYSQL_USER:-sms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms_password_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_2026}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: student-management-system:${APP_VERSION:-1.0.0}
    container_name: sms_web_${COMPOSE_PROJECT_NAME:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-isgs-2026}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_PORT: 5000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-student_management_db}
      MYSQL_USER: ${MYSQL_USER:-sms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms_password_2026}
    ports:
      - "${HOST_PORT:-5000}:5000"
    networks:
      - sms_network

volumes:
  mysql_data:

networks:
  sms_network:
    driver: bridge