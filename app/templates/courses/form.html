{% extends "base.html" %}
{% block title %}{{ 'Modifier' if course else 'Créer' }} un Cours{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0" style="border-radius: 12px;">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold">{{ 'Modifier le cours' if course else 'Créer un nouveau cours' }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Code Cours *</label>
                            <input type="text" name="course_code" class="form-control" value="{{ course.course_code if course else '' }}" placeholder="CLOUD-305" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Crédits</label>
                            <input type="number" step="0.5" name="credits" class="form-control" value="{{ course.credits if course else '3.0' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Semestre</label>
                            <select name="semester" class="form-select">
                                <option value="S1" {{ 'selected' if not course or course.semester == 'S1' }}>Semestre 1 (S1)</option>
                                <option value="S2" {{ 'selected' if course and course.semester == 'S2' }}>Semestre 2 (S2)</option>
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Intitulé de la matière *</label>
                            <input type="text" name="title" class="form-control" value="{{ course.title if course else '' }}" required>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Enseignant Responsable</label>
                            <select name="teacher_id" class="form-select">
                                <option value="">-- Aucun enseignant affecté --</option>
                                {% for t in teachers %}
                                <option value="{{ t.id }}" {{ 'selected' if course and course.teacher_id == t.id }}>
                                    {{ t.teacher_code }} - {{ t.first_name }} {{ t.last_name }} ({{ t.department }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-semibold">Description</label>
                            <textarea name="description" class="form-control" rows="3">{{ course.description if course and course.description else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <a href="{{ url_for('courses.list_courses') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary px-4">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
