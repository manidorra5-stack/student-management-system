{% extends "base.html" %}
{% block title %}Saisie des Notes{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0" style="border-radius: 12px;">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold">Saisir ou modifier une note</h4>
                <div>Moyenne calculée : <span id="final_grade_preview" class="badge bg-secondary fs-6">0.00 / 20</span></div>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Inscription (Étudiant — Cours) *</label>
                        <select name="enrollment_id" class="form-select" required>
                            <option value="">-- Choisir une inscription --</option>
                            {% for e in enrollments %}
                            <option value="{{ e.id }}" {{ 'selected' if selected_enrollment_id == e.id }}>
                                {{ e.student_code }} - {{ e.student_name }} | {{ e.course_code }} ({{ e.course_title }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="continuous_assessment" class="form-label fw-semibold">Note Contrôle Continu (40%) *</label>
                            <input type="number" step="0.01" min="0" max="20" id="continuous_assessment" name="continuous_assessment" class="form-control"
                                   value="{{ existing_grade.continuous_assessment if existing_grade else '0' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="exam_score" class="form-label fw-semibold">Note Examen Final (60%) *</label>
                            <input type="number" step="0.01" min="0" max="20" id="exam_score" name="exam_score" class="form-control"
                                   value="{{ existing_grade.exam_score if existing_grade else '0' }}" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Remarques / Appréciation</label>
                        <input type="text" name="remarks" class="form-control" value="{{ existing_grade.remarks if existing_grade and existing_grade.remarks else '' }}" placeholder="Ex: Très bon travail">
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('grades.list_grades') }}" class="btn btn-outline-secondary">Annuler</a>
                        <button type="submit" class="btn btn-primary px-4">Enregistrer la note</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
